name: locstore
description: "LocStore — مدیریت انبار و فاکتور پوشاک (local-first inventory & invoicing)."
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # SQLite database (source of truth)
  sqflite: ">=2.4.0 <3.0.0"
  path: ^1.9.0

  # App storage paths
  path_provider: ">=2.1.0 <3.0.0"

  # Lightweight state management
  provider: ">=6.1.0 <7.0.0"

  # Native Android share sheet (invoice image, backup files)
  share_plus: ">=11.0.0 <15.0.0"

  # Product photos: camera + gallery
  image_picker: ">=1.1.0 <2.0.0"

  # Backup save/restore through Android file interface
  file_picker: ">=8.1.0 <11.0.0"

dependency_overrides:
  # 2.3.x pulls the `jni` bridge (C++/CMake/NDK build) for no functional
  # benefit in this offline app; 2.2.x uses the classic method channel.
  path_provider_android: 2.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Real SQLite in unit tests (desktop)
  sqflite_common_ffi: ">=2.3.0 <3.0.0"

flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
